name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "Release ${{ github.ref_name }}" --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs:
      - prepare
    strategy:
      matrix:
        builds:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.builds.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: cargo build --release --target "${{ matrix.builds.target }}"

      - name: Tests
        run: cargo test

      - name: Package
        shell: bash
        run: |
          export ARCHIVE_NAME="todograph-${{ github.ref_name }}-${{ matrix.builds.target }}.zip"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

          if [ "${{ matrix.builds.os }}" = "windows-latest" ]; then
            7z a -stl $ARCHIVE_NAME "./target/${{ matrix.builds.target }}/release/tg-gui-app.exe" "./target/${{ matrix.builds.target }}/release/tg-cli-app.exe"
            7z rn $ARCHIVE_NAME tg-gui-app.exe todograph.exe
            7z rn $ARCHIVE_NAME tg-cli-app.exe todograph-cli.exe
          else
            7z a -stl $ARCHIVE_NAME "./target/${{ matrix.builds.target }}/release/tg-gui-app" "./target/${{ matrix.builds.target }}/release/tg-cli-app" 
            7z rn $ARCHIVE_NAME tg-gui-app todograph
            7z rn $ARCHIVE_NAME tg-cli-app todograph-cli
          fi

          # 7z a $ARCHIVE_NAME "License"

      - name: Upload
        shell: bash
        run: |
          gh release upload ${{ github.ref_name }} $ARCHIVE_NAME
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release
        run: |
          gh release edit ${{ github.ref_name }} --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
