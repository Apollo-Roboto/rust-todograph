[workspace]
resolver = "3"
members = ["crates/core", "crates/cli_app", "crates/gui_app"]
# default-members = ["crates/gui_app"]

[workspace.package]
authors = ["ApolloRoboto"]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = "1.0.228"
serde_json = "1.0.145"
chrono = "0.4.42"
rfd = "0.15.4"
tempfile = "3.23.0"
log = "0.4.28"
pretty_assertions = "1.4.1"
