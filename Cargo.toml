[workspace]
resolver = "3"
members = ["crates/core", "crates/cli_app", "crates/gui_app"]
# default-members = ["crates/gui_app"]

[workspace.package]
authors = ["ApolloRoboto"]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
serde = "1.0.228"
serde_json = "1.0.149"
chrono = "0.4.44"
rfd = "0.17.2"
tempfile = "3.27.0"
log = "0.4.29"
pretty_assertions = "1.4.1"
